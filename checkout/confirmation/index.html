<!DOCTYPE html>
<html lang="en">
<head>
    <title>Purchase Confirmation</title>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="description" content="Thank you for shopping with us!">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body class="confirmation-page">
<main>
    <section class="order-confirmation">
            <h1>Order Confirmation</h1>
            <p>Order #123456</p>
            <img src="images/success.svg" alt="success icon" class="success-icon">
            <div class="confirmation-text">
                <p><strong>Thank you for your purchase!</strong></p>
                <p>Your order is being processed. You will receive a confirmation email shortly.</p>
                <p>Once your order it's on its way, we'll send you a shipping notification.</p>
            </div>
            <a href="index.html" class="btn-home">Home Page</a>
    </section>
</main>
</body>
